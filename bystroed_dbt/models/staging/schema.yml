version: 2

models:
  - name: stg_products
    description: "Очищенные данные о товарах из 1С"
    columns:
      - name: product_id
        description: "Уникальный идентификатор товара"
        tests:
          - unique
          - not_null
      - name: name
        description: "Название товара"
        tests:
          - not_null
      - name: category
        description: "Категория товара"
        tests:
          - not_null
      - name: price
        description: "Цена товара"
        tests:
          - not_null

  - name: stg_customers
    description: "Очищенные данные о клиентах"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_name
        tests:
          - not_null
      - name: city
        tests:
          - not_null
          
  - name: stg_orders
    description: "Очищенные данные о заказах"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null        